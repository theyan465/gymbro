<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14202b"/><stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.22" cy="0.16" r="0.6"><stop offset="0" stop-color="#34d399" stop-opacity=".34"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.55"><stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe9dd"/></linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="fglow"><stop offset="0" stop-color="#f97316" stop-opacity=".45"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow1)"/>
  <rect width="1024" height="1024" fill="url(#glow2)"/>
  <!-- progress ring -->
  <g transform="rotate(-90 512 512)">
    <circle cx="512" cy="512" r="316" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="56"/>
    <circle cx="512" cy="512" r="316" fill="none" stroke="#34d399" stroke-opacity=".55" stroke-width="56" stroke-linecap="round" stroke-dasharray="1560 3000" filter="url(#soft)"/>
    <circle cx="512" cy="512" r="316" fill="none" stroke="url(#ring)" stroke-width="56" stroke-linecap="round" stroke-dasharray="1560 3000"/>
  </g>
  <!-- dumbbell -->
  <g filter="url(#drop)" fill="url(#metal)" transform="translate(512 462) scale(1.1) translate(-512 -512)">
    <rect x="330" y="494" width="364" height="36" rx="18"/>
    <rect x="352" y="392" width="62" height="240" rx="26"/>
    <rect x="610" y="392" width="62" height="240" rx="26"/>
    <rect x="296" y="446" width="48" height="132" rx="22"/>
    <rect x="680" y="446" width="48" height="132" rx="22"/>
  </g>
  <!-- streak flame -->
  <circle cx="512" cy="715" r="105" fill="url(#fglow)"/>
  <g transform="translate(512 712) scale(6) translate(-12 -12)">
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="url(#fl)"/>
  </g>
</svg>
